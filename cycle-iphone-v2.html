<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEF4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cycle">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet">
<link id="fontsAll" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;height:100%;background:var(--bg)}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font),system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
body.locked{overflow:hidden}
button{cursor:pointer;font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,input{-webkit-user-select:text;user-select:text}
#wall{position:fixed;inset:-24px;background-size:cover;background-position:center;z-index:0;display:none}
#dim{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 1.4rem) 1.5rem calc(env(safe-area-inset-bottom,0px) + 6.5rem)}
.view{display:none}.view.on{display:block}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;align-items:center;gap:.15rem;padding:1.4rem 1rem calc(env(safe-area-inset-bottom,0px) + .7rem);background:linear-gradient(to top,var(--bgA) 60%,transparent)}
#nav button{background:none;border:0;color:var(--ink2);font-size:.98rem;padding:.6rem .85rem;border-radius:999px}
#nav button.on{color:var(--ink);font-weight:600}
#nav svg{width:1.3rem;height:1.3rem;display:block}
body.setup #nav{display:none}

/* today */
.date{color:var(--ink2);font-size:.95rem}
.hero{display:flex;align-items:flex-end;gap:1rem;margin:1.6rem 0 1.4rem}
.big{font-size:7.2rem;font-weight:300;line-height:.8;letter-spacing:-.055em}
.big.none{font-size:4.5rem}
.side{padding-bottom:.35rem}
.side .k{color:var(--ink2);font-size:.92rem}
.side .ph{font-size:1.4rem;font-weight:500;margin-top:.1rem}
.strip{display:flex;gap:2px;height:30px;align-items:center}
.strip i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.strip i.p{background:var(--period)}
.strip i.f{background:var(--fertile)}
.strip i.o{background:var(--ovu);height:10px}
.strip i.fut{opacity:.42}
.strip i.now{height:26px;opacity:1;box-shadow:0 0 0 2px var(--bg)}
.strip i.now:not(.p):not(.f):not(.o){background:var(--ink)}
.stripLab{display:flex;justify-content:space-between;color:var(--ink2);font-size:.8rem;margin-top:.3rem}
.lines{margin:1.6rem 0 1.4rem;display:grid;gap:.45rem;font-size:1.12rem;line-height:1.35}
.lines .s{color:var(--ink2);font-size:.95rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.6rem}
.btn{border:0;border-radius:999px;padding:.8rem 1.25rem;font-size:.98rem;font-weight:600;background:var(--accent);color:var(--onAccent)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px var(--line)}
.btn.wide{width:100%}
.btn.warn{background:#B3261E;color:#fff}
.card{background:var(--card);border:1px solid var(--cardB);border-radius:1.25rem;padding:1.1rem 1.2rem;margin-bottom:.8rem;-webkit-backdrop-filter:var(--cardBlur);backdrop-filter:var(--cardBlur)}
.card h3{font-size:1.05rem;font-weight:600;margin-bottom:.35rem}
.card p{color:var(--ink2);line-height:1.55;font-size:.95rem}
.card .row{margin-top:.7rem;font-size:.95rem;line-height:1.5}
.card .row b{font-weight:600}
.card .tap{border:0;background:none;color:var(--ink2);font-size:.85rem;margin-top:.7rem;padding:.2rem 0;text-decoration:underline;text-underline-offset:3px}
.qm{margin-bottom:1.4rem}
.qm .lab{color:var(--ink2);font-size:.92rem;margin-bottom:.6rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:transparent;color:inherit;font-size:.92rem;padding:.5rem .85rem;border-radius:999px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.note{font-size:.8rem;color:var(--ink2);line-height:1.5;margin-top:1rem}

/* calendar */
.calHead{display:flex;align-items:flex-end;justify-content:space-between;margin:.6rem 0 1.4rem}
.calHead h1{font-size:2.6rem;font-weight:300;letter-spacing:-.035em;line-height:1}
.calHead .yr{color:var(--ink2);font-size:1rem;margin-top:.3rem}
.navs{display:flex;gap:.4rem}
.navb{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:1.1rem;display:grid;place-items:center}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:.78rem;color:var(--ink2);padding-bottom:.6rem}
.grid{row-gap:.3rem}
.cell{aspect-ratio:1;display:grid;place-items:center;position:relative;border:0;background:none;color:var(--ink);font-size:.98rem}
.cell .n{width:2.45rem;height:2.45rem;display:grid;place-items:center;border-radius:50%;border:1.5px solid transparent}
.cell.fert .n{background:var(--fertileT)}
.cell.ovu .n{border-color:var(--ovu);background:var(--ovuT)}
.cell.pred .n{border:1.5px dashed var(--period);background:none}
.cell.spot .n{background:var(--periodT)}
.cell.per .n{background:var(--period);color:var(--onPeriod);border-color:var(--period)}
.cell.today .n{font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.cell.out{visibility:hidden}
.cell .dots{position:absolute;bottom:.05rem;left:0;right:0;display:flex;justify-content:center;gap:3px}
.cell .dots i{width:4px;height:4px;border-radius:50%;background:var(--ink2)}
.cell .dots i.sx{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:.6rem 1.1rem;margin:1.4rem 0 .4rem;font-size:.82rem;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:.4rem}
.legend i{width:.85rem;height:.85rem;border-radius:50%;display:inline-block}

/* insights */
.pageT{font-size:2.6rem;font-weight:300;letter-spacing:-.035em;margin:.6rem 0 1.4rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.4rem}
.stat .v{font-size:2.5rem;font-weight:300;letter-spacing:-.04em;line-height:1}
.stat .k{color:var(--ink2);font-size:.82rem;margin-top:.35rem;line-height:1.3}
.hist{display:grid;gap:.6rem}
.hrow{display:grid;grid-template-columns:4.6rem 1fr 2rem;gap:.7rem;align-items:center;font-size:.88rem}
.hrow .d{color:var(--ink2)}
.hbar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.hbar b{position:absolute;left:0;top:0;bottom:0;background:var(--period);border-radius:4px}
.hbar u{position:absolute;top:0;bottom:0;background:var(--ink2);opacity:.35;border-radius:4px}
.hrow .l{text-align:right;font-weight:600}
.pat{margin-top:.55rem;font-size:.92rem;line-height:1.5}
.pat .pn{font-weight:600}
.pat .pv{color:var(--ink2)}

/* setup */
#v-setup .pageT{margin-top:2.2rem}
#v-setup p.lead{color:var(--ink2);line-height:1.55;margin-bottom:1.6rem;max-width:30rem}
.q{padding:1.1rem 0;border-top:1px solid var(--line)}
.q .lab{font-size:1.05rem;margin-bottom:.7rem}
.q .hint{color:var(--ink2);font-size:.85rem;margin-top:.5rem;line-height:1.45}
.dateIn{font:inherit;font-size:1rem;color:inherit;background:transparent;border:1px solid var(--line);border-radius:.9rem;padding:.7rem .9rem;width:100%;max-width:16rem;color-scheme:var(--scheme)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{--ink:var(--sInk);--ink2:var(--sInk2);--line:var(--sLine);position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:600px;margin:0 auto;max-height:90vh;max-height:90dvh;border-radius:1.6rem 1.6rem 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;background:var(--sBg);color:var(--sInk);font-size:1rem}
#sheet.on{transform:none}
#sheetBody{overflow-y:auto;padding:0 1.4rem calc(env(safe-area-inset-bottom,0px) + 1.8rem);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grab{width:2.4rem;height:.3rem;border-radius:9px;background:var(--sLine);margin:.7rem auto .5rem;flex:none}
.sTop{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.2rem 0 .3rem}
.sTop h2{font-size:1.45rem;font-weight:600;letter-spacing:-.01em}
.sTop .ph{color:var(--ink2);font-size:.88rem;margin-top:.15rem}
.sec{margin:1.5rem 0 .55rem;font-size:.88rem;color:var(--ink2)}
.set{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.set .lab{font-size:.98rem}
.set .hint{font-size:.8rem;color:var(--ink2);margin-top:.15rem;line-height:1.4}
.stepper{display:flex;align-items:center;gap:.45rem;flex:none}
.stepper button{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);background:none;color:inherit;font-size:1.15rem;line-height:1}
.stepper span{min-width:2rem;text-align:center;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;color:inherit;font-size:.86rem;padding:.42rem .75rem;border-radius:999px}
.seg button.on{background:var(--accent);color:var(--onAccent)}
.sws{display:flex;flex-wrap:wrap;gap:.5rem;padding:.2rem 0 .9rem;border-bottom:1px solid var(--line)}
.swl{padding-top:.75rem;font-size:.98rem;margin-bottom:.55rem}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);position:relative;background:none;color:inherit;font-size:.78rem;font-weight:700;display:grid;place-items:center;overflow:hidden}
.sw.on{outline:2px solid var(--sInk);outline-offset:2px}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tog{width:2.9rem;height:1.7rem;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(1.2rem)}
.rng{padding:.75rem 0;border-bottom:1px solid var(--line)}
.rng .top{display:flex;justify-content:space-between;font-size:.98rem;margin-bottom:.4rem}
.rng .top span:last-child{color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--accent)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.3rem 0 .9rem;border-bottom:1px solid var(--line)}
.fonts button{border:1px solid var(--line);background:none;color:inherit;border-radius:1rem;padding:.75rem .8rem;text-align:left;font-size:1.02rem}
.fonts button small{display:block;font-size:.75rem;color:var(--ink2);margin-top:.1rem}
.fonts button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:.9rem .6rem;padding:.4rem 0 .9rem}
.icons button{border:0;background:none;color:inherit;font-size:.78rem;display:grid;justify-items:center;gap:.4rem}
.ic{width:3.6rem;height:3.6rem;border-radius:32%;overflow:hidden;display:grid;place-items:center}
.ic img{width:150%;height:150%;flex:none}
.icons button.on .ic{outline:2px solid var(--accent);outline-offset:3px}
.wallRow{display:flex;gap:.5rem;flex-wrap:wrap;padding:.75rem 0;border-bottom:1px solid var(--line);align-items:center}
.wallPrev{width:3rem;height:4.4rem;border-radius:.6rem;background-size:cover;background-position:center;border:1px solid var(--line)}
.txt{width:100%;min-height:6rem;font:inherit;font-size:.95rem;color:inherit;background:transparent;border:1px solid var(--line);border-radius:1rem;padding:.75rem .9rem;resize:vertical;line-height:1.5}
.help p{color:var(--ink2);font-size:.9rem;line-height:1.55;margin:.4rem 0}
.mini{border:0;background:none;color:inherit;width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);font-size:1.05rem;flex:none}
.done{margin-top:1.4rem}
#toast{position:fixed;left:50%;width:max-content;bottom:calc(env(safe-area-inset-bottom,0px) + 5.5rem);transform:translate(-50%,1rem);background:var(--sInk);color:var(--sBg);padding:.7rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="wall"></div><div id="dim"></div>
<main id="app">
  <section id="v-setup" class="view"></section>
  <section id="v-today" class="view"></section>
  <section id="v-cal" class="view"></section>
  <section id="v-ins" class="view"></section>
</main>
<nav id="nav">
  <button data-v="today">Today</button>
  <button data-v="cal">Calendar</button>
  <button data-v="ins">Insights</button>
  <button id="navCust" aria-label="Customise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<input type="file" id="wallFile" accept="image/*" hidden>

<script>
const APP={platform:'iphone',version:2};
const ICONS=JSON.parse(document.getElementById('icon-data').textContent);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='cycle.data',WKEY='cycle.wall';
const DEF={setup:{done:false,lastStart:'',bleed:5,cycle:28,luteal:14,learn:true,weekStart:1},
  days:{},
  look:{mode:'auto',bg:'',accent:'#C8475B',period:'#C8475B',fertile:'#5E9E95',ovu:'#D99A2B',text:'',text2:'',font:'Albert Sans',size:100,card:'glass',dim:35,blur:0},
  show:{phase:true,fact:true,mood:true},factI:0};
const clone=o=>JSON.parse(JSON.stringify(o));
function merge(base,d){for(const k in d){if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])&&k!=='days'&&d[k]&&typeof d[k]==='object')Object.assign(base[k],d[k]);else base[k]=d[k]}return base}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d==='object')return merge(clone(DEF),d)}catch(e){}return clone(DEF)}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Your phone storage is full, so this change was not saved')}}
function getWall(){try{return localStorage.getItem(WKEY)||''}catch(e){return''}}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ymd=s=>{const[y,m,d]=s.split('-').map(Number);return[y,m-1,d]};
const parse=s=>new Date(...ymd(s));
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((Date.UTC(...ymd(b))-Date.UTC(...ymd(a)))/864e5);
const today=()=>iso(new Date());
const fmt=(s,o)=>parse(s).toLocaleDateString('en-GB',o);
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- options ---------- */
const FLOW=[['','None'],['spotting','Spotting'],['light','Light'],['medium','Medium'],['heavy','Heavy']];
const MOODS=['Happy','Calm','Energetic','Loving','Sensitive','Irritable','Anxious','Sad','Low energy'];
const SYMS=['Cramps','Bloating','Headache','Tender breasts','Acne','Backache','Cravings','Nausea','Fatigue','Trouble sleeping','Discharge'];
const SEX=[['','None'],['protected','Protected'],['unprotected','Unprotected'],['solo','Solo']];
const OVS=['Positive ovulation test','Egg-white discharge','Ovulation pain'];
const BLEED=['light','medium','heavy'];

/* ---------- phase content ---------- */
const PH={
 menstrual:{name:'Period',full:'Menstrual phase',
  p:'Your uterus is shedding its lining. Estrogen and progesterone are at their lowest, which is why energy can dip in the first few days.',
  common:'Cramps, lower back ache, tiredness, bloating, headaches, low or tender mood',
  tryit:'Heat on your lower belly, gentle movement like walking or stretching, iron-rich food (leafy greens, beans, red meat), extra rest'},
 follicular:{name:'Follicular',full:'Follicular phase',
  p:'Estrogen is rising as your ovaries prepare an egg. Many people feel their energy, mood and focus lift during these days.',
  common:'More energy, brighter mood, clearer skin, feeling more social',
  tryit:'Starting new projects, harder workouts, planning and problem-solving'},
 ovulatory:{name:'Ovulation',full:'Ovulation',
  p:'A surge of luteinising hormone releases an egg, which lives for about 12 to 24 hours. These are your most fertile days.',
  common:'Clear, stretchy discharge, a brief one-sided twinge, higher sex drive, feeling confident',
  tryit:'If you are trying to conceive, this is the time. If you are not, use contraception, because predictions can be off by a few days'},
 luteal:{name:'Luteal',full:'Luteal phase',
  p:'Progesterone rises after ovulation. If there is no pregnancy, hormones fall in the last week, which is when PMS tends to show up.',
  common:'Bloating, tender breasts, cravings, irritability, acne, trouble sleeping, feeling more tired',
  tryit:'Complex carbs and magnesium-rich food (nuts, seeds, dark chocolate), less salt and caffeine, steady sleep, lighter workouts late in the phase'},
 late:{name:'Late',full:'Your period is late',
  p:'Stress, illness, travel, changes in weight or exercise, and hormonal shifts can all push a period back. A late period now and then is common.',
  common:'Similar to PMS: bloating, tender breasts, mood changes',
  tryit:'If you have had unprotected sex, a pregnancy test is the surest way to know. If your cycles stay irregular, a doctor or nurse can help find out why'}
};
const FACTS=[
 'A typical adult cycle lasts anywhere from 21 to 35 days. 28 is only an average.',
 'Ovulation usually happens about 14 days before your next period, not on day 14.',
 'Sperm can survive up to 5 days, which is why your fertile window starts before ovulation.',
 'An egg lives for about 12 to 24 hours after it is released.',
 'Periods usually last 2 to 7 days, and the first two days tend to be the heaviest.',
 'Most people lose about 30 to 40 ml of blood per period, roughly two to three tablespoons.',
 'Cramps come from prostaglandins, chemicals that make the uterus contract.',
 'Research has found heat on the lower belly can ease cramps about as well as some over-the-counter pain relief.',
 'Your resting body temperature rises slightly after ovulation and stays up until your period starts.',
 'Stress can delay ovulation, which pushes your whole period back.',
 'It is normal for your cycle to vary by a few days from month to month.',
 'PMS symptoms usually ease within a few days of your period starting.',
 'Period pain that stops you from doing everyday things is worth raising with a doctor. Conditions like endometriosis are often missed.',
 'Soaking through a pad or tampon every hour or two is considered heavy bleeding and worth getting checked.',
 'Cycle apps can only estimate ovulation. On their own, they are not reliable contraception.'
];

/* ---------- cycle model ---------- */
function model(){
 const T=today(),st=S.setup;
 const fd=Object.keys(S.days).filter(k=>BLEED.includes(S.days[k].flow)).sort();
 const groups=[];
 for(const k of fd){const g=groups[groups.length-1];if(g&&diff(g.end,k)<=2)g.end=k;else groups.push({start:k,end:k})}
 groups.forEach(g=>g.len=diff(g.start,g.end)+1);
 let starts=groups.map(g=>g.start);
 if(st.lastStart&&!starts.some(s=>Math.abs(diff(s,st.lastStart))<=10))starts.push(st.lastStart);
 starts=starts.filter(s=>s<=T).sort();
 const lens=[];for(let i=1;i<starts.length;i++){const l=diff(starts[i-1],starts[i]);if(l>=15&&l<=60)lens.push(l)}
 const rl=lens.slice(-6);
 const L=st.learn&&rl.length>=2?Math.round(avg(rl)):st.cycle;
 const fin=groups.filter(g=>diff(g.end,T)>2&&g.len<=12).slice(-6);
 const P=Math.min(st.learn&&fin.length>=2?Math.round(avg(fin.map(g=>g.len))):st.bleed,L-6);
 const O=Math.max(L-st.luteal,P+2);
 const last=starts[starts.length-1]||null;
 const m={T,groups,starts,lens,L,P,O,last,day:null,next:null,late:0};
 if(last){m.day=diff(last,T)+1;m.next=addD(last,L);if(m.day>L)m.late=m.day-L}
 return m;
}
function phaseOf(d,L,P,O){if(d<=P)return'menstrual';if(d>L)return'late';if(d>=O-1&&d<=O+1)return'ovulatory';if(d<O-1)return'follicular';return'luteal'}
/* which cycle a date belongs to, and its day number */
function cyc(s,m){
 if(!m.last||s<m.starts[0])return null;
 if(s<m.last){let i=m.starts.length-1;while(i>0&&m.starts[i]>s)i--;const cs=m.starts[i],cl=diff(cs,m.starts[i+1]);return{cs,d:diff(cs,s)+1,cl,O:Math.max(cl-S.setup.luteal,m.P+2),past:true}}
 if(!m.late||s<=m.T){const d0=diff(m.last,s);const k=m.late?0:Math.floor(d0/m.L);if(k>6)return null;const cs=addD(m.last,k*m.L);return{cs,d:diff(cs,s)+1,cl:m.L,O:m.O,k}}
 const ps=addD(m.T,1),k=Math.floor(diff(ps,s)/m.L);if(k>6)return null;const cs=addD(ps,k*m.L);return{cs,d:diff(cs,s)+1,cl:m.L,O:m.O,k:k+1};
}
function info(s,m){
 const e=S.days[s]||{},r={flow:e.flow||'',pred:false,fert:false,ovu:false,phase:null};
 const c=cyc(s,m);if(!c)return r;
 if(c.cl<=45){r.fert=c.d>=c.O-5&&c.d<=c.O+1;r.ovu=c.d===c.O}
 if(s>m.T&&c.d<=m.P&&!e.flow)r.pred=c.cs!==m.last||!m.groups.some(g=>g.start===m.last)||onPeriod(m)>0;
 r.phase=BLEED.includes(e.flow)?'menstrual':phaseOf(c.d,c.cl,m.P,c.O);
 return r;
}

/* ---------- colours ---------- */
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function lum(h){const[r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
const rgba=(h,a)=>{const[r,g,b]=rgb(h);return`rgba(${r},${g},${b},${a})`};
const onC=h=>lum(h)>.45?'#211A26':'#FFFFFF';
function sysDark(){return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}

/* ---------- look ---------- */
function applyLook(){

 const dark=L.mode==='dark'||(L.mode==='auto'&&sysDark());

 const ink2=L.text2||rgba(ink,.6);
 const v={'--bg':bg,'--bgA':rgba(bg,.94),'--ink':ink,'--ink2':ink2,'--line':bd?'rgba(255,255,255,.15)':'rgba(42,34,48,.13)',
  '--accent':L.accent,'--onAccent':onC(L.accent),'--period':L.period,'--onPeriod':onC(L.period),'--periodT':rgba(L.period,.22),
  '--fertile':L.fertile,'--fertileT':rgba(L.fertile,.26),'--ovu':L.ovu,'--ovuT':rgba(L.ovu,.16),
  '--font':L.font==='System'?'system-ui':'"'+L.font+'"','--scheme':bd?'dark':'light'};
 const sd=bd;
 Object.assign(v,{'--sBg':sd?'#221D27':'#FBF8FB','--sInk':sd?'#F2EBF3':'#2A2230','--sInk2':sd?'rgba(242,235,243,.6)':'rgba(42,34,48,.58)','--sLine':sd?'rgba(255,255,255,.13)':'rgba(42,34,48,.12)'});
 const base=bd?'255,255,255':'255,255,255';
 const card={glass:[bd?'rgba(255,255,255,.07)':'rgba(255,255,255,.55)',bd?'rgba(255,255,255,.08)':'rgba(255,255,255,.6)','blur(14px)'],
  solid:[bd?'rgba(255,255,255,.08)':'#FFFFFF','transparent','none'],
  outline:['transparent',bd?'rgba(255,255,255,.18)':'rgba(42,34,48,.16)','none'],
  none:['transparent','transparent','none']}[L.card]||[];
 v['--card']=card[0];v['--cardB']=card[1];v['--cardBlur']=card[2];
 for(const k in v)r.setProperty(k,v[k]);
 document.documentElement.style.fontSize=(16*L.size/100)+'px';
 loadFont(L.font);
 const w=getWall(),wall=$('#wall'),dim=$('#dim');
 if(w){wall.style.display='block';wall.style.backgroundImage='url("'+w+'")';wall.style.filter=L.blur?'blur('+L.blur+'px)':'none';dim.style.background=rgba(bg,L.dim/100);document.body.style.background='transparent'}
 else{wall.style.display='none';dim.style.background='none';document.body.style.background=''}

 try{window.Android&&Android.setBars&&Android.setBars(bg,!bd)}catch(e){}
}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{applyLook()});

/* ---------- helpers ---------- */
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function entry(s){return S.days[s]||(S.days[s]={})}
function tidy(s){const e=S.days[s];if(!e)return;const empty=!e.flow&&!(e.moods&&e.moods.length)&&!(e.syms&&e.syms.length)&&!e.sex&&!(e.ovs&&e.ovs.length)&&!(e.note&&e.note.trim());if(empty)delete S.days[s]}
function summary(e){if(!e)return'';const a=[];if(e.flow)a.push(FLOW.find(f=>f[0]===e.flow)[1]+(e.flow==='spotting'?'':' flow'));(e.moods||[]).forEach(x=>a.push(x));(e.syms||[]).forEach(x=>a.push(x));if(e.sex)a.push(e.sex==='solo'?'Solo':(e.sex==='protected'?'Protected sex':'Unprotected sex'));(e.ovs||[]).forEach(x=>a.push(x));if(e.note&&e.note.trim())a.push('Note');return a.join(', ')}

function renderToday(){
 const m=model(),T=m.T,e=S.days[T]||{},el=$('#v-today');
 const date=fmt(T,{weekday:'long',day:'numeric',month:'long'});
 if(!m.last){
  el.innerHTML=`<div class="date">${date}</div>
  <div class="hero"><span class="big none">Hello</span></div>
  <div class="lines"><div>Log the start of your period to see predictions.</div><div class="s">You can also enter your last start date in Customise.</div></div>
  <div class="actions"><button class="btn" id="tStart">Period started today</button><button class="btn ghost" id="tLog">Log today</button></div>
  ${moodBlock(e)}${factCard()}`;
  bindToday();return;
 }
 const ph=BLEED.includes(e.flow)?'menstrual':phaseOf(m.day,m.L,m.P,m.O);
 const n=Math.max(m.L,m.day),segs=[],g0=m.groups.find(x=>x.start===m.last),pd0=onPeriod(m);
 for(let d=1;d<=n;d++){const s=addD(m.last,d-1),x=S.days[s]||{};let c='';
  if(BLEED.includes(x.flow)||(!g0&&d<=m.P)||(g0&&pd0&&d>m.day&&d<=m.P))c='p';
  else if(d===m.O)c='o';else if(d>=m.O-5&&d<=m.O+1)c='f';
  if(d>m.day)c+=' fut';if(d===m.day)c+=' now';segs.push(`<i class="${c}"></i>`)}
 const lines=[];
 const pd=onPeriod(m);
 if(m.late){lines.push(`Your period is ${plural(m.late,'day')} late`);lines.push(`<span class="s">It was expected on ${fmt(m.next,{day:'numeric',month:'long'})}</span>`)}
 else{
  const dn=diff(T,m.next);
  if(pd)lines.push(`Period day ${pd}`);
  lines.push(dn===0?'Period expected today':`Next period in ${plural(dn,'day')}<span class="s">, around ${fmt(m.next,{day:'numeric',month:'short'})}</span>`);
  const fs=m.O-5,fe=m.O+1;
  if(m.day===m.O)lines.push('Ovulation is likely today');
  else if(m.day>=fs&&m.day<=fe)lines.push(`Fertile window, ${plural(fe-m.day+1,'day')} left`);
  else if(m.day<fs)lines.push(`<span class="s">Fertile window starts in ${plural(fs-m.day,'day')}</span>`);
 }
 const p=PH[ph];
 el.innerHTML=`<div class="date">${date}</div>
 <div class="hero"><span class="big">${m.day}</span><div class="side"><div class="k">day of your cycle</div><div class="ph">${p.name}</div></div></div>
 <div class="strip" aria-hidden="true">${segs.join('')}</div>
 <div class="stripLab"><span>${fmt(m.last,{day:'numeric',month:'short'})}</span><span>${m.late?'Today':fmt(m.next,{day:'numeric',month:'short'})}</span></div>
 <div class="lines">${lines.map(l=>`<div>${l}</div>`).join('')}</div>
 <div class="actions">${pd?`<button class="btn" id="tLog">Log today</button>`:`<button class="btn" id="tStart">Period started</button><button class="btn ghost" id="tLog">Log today</button>`}</div>
 ${summary(e)?`<div class="card"><h3>Today</h3><p>${esc(summary(e))}</p></div>`:''}
 ${moodBlock(e)}
 ${S.show.phase?`<div class="card"><h3>${p.full}</h3><p>${p.p}</p><div class="row"><b>Common now:</b> ${p.common}.</div><div class="row"><b>What can help:</b> ${p.tryit}.</div></div>`:''}
 ${factCard()}
 ${ph==='ovulatory'||m.day>=m.O-5&&m.day<=m.O+1?`<p class="note">Fertile days are estimates based on your cycle length. Don't rely on them alone for contraception.</p>`:''}`;
 bindToday();
}
function onPeriod(m){const g=m.groups[m.groups.length-1];if(!g||g.start!==m.last)return 0;const T=m.T;if(diff(g.end,T)<=1&&diff(g.start,T)>=0)return diff(g.start,T)+1;return 0}
function moodBlock(e){if(!S.show.mood)return'';const mo=e.moods||[];return`<div class="qm"><div class="lab">How are you feeling today?</div><div class="chips">${MOODS.map(x=>`<button class="chip${mo.includes(x)?' on':''}" data-qm="${x}">${x}</button>`).join('')}</div></div>`}
function factCard(){if(!S.show.fact)return'';const f=FACTS[S.factI%FACTS.length];return`<div class="card"><h3>Good to know</h3><p>${f}</p><button class="tap" id="nextFact">Show another</button></div>`}
function bindToday(){
 const T=today();
 $('#tLog')&&($('#tLog').onclick=()=>openLog(T));
 $('#tStart')&&($('#tStart').onclick=()=>{const e=entry(T);if(!BLEED.includes(e.flow))e.flow='medium';save();buzz();toast('Period logged for today');renderToday()});
 $$('#v-today [data-qm]').forEach(b=>b.onclick=()=>{const e=entry(T);e.moods=e.moods||[];const x=b.dataset.qm;e.moods=e.moods.includes(x)?e.moods.filter(y=>y!==x):[...e.moods,x];tidy(T);save();buzz();renderToday()});
 $('#nextFact')&&($('#nextFact').onclick=()=>{S.factI=(S.factI+1)%FACTS.length;save();renderToday()});
}

 const[y,mo]=calM.split('-').map(Number),first=new Date(y,mo-1,1),dim=new Date(y,mo,0).getDate();
 const ws=S.setup.weekStart,off=(first.getDay()-ws+7)%7;
 const wd=[];for(let i=0;i<7;i++)wd.push(new Date(2024,0,7+ws+i).toLocaleDateString('en-GB',{weekday:'narrow'}));
 let cells='';for(let i=0;i<off;i++)cells+='<span class="cell out"></span>';
 for(let d=1;d<=dim;d++){const s=y+'-'+pad(mo)+'-'+pad(d),r=info(s,m),e=S.days[s]||{};const c=['cell'];
  if(BLEED.includes(r.flow))c.push('per');else if(r.flow==='spotting')c.push('spot');else if(r.pred)c.push('pred');else if(r.ovu)c.push('ovu');else if(r.fert)c.push('fert');

 <div class="wk">${wd.map(w=>`<span>${w}</span>`).join('')}</div><div class="grid">${cells}</div>

function renderIns(){
 const m=model();
 const fin=m.groups.filter(g=>diff(g.end,m.T)>2);
 const avgP=fin.length?Math.round(avg(fin.slice(-6).map(g=>g.len))):null;
 const avgL=m.lens.length?Math.round(avg(m.lens.slice(-6))):null;
 const hist=[];for(let i=m.starts.length-1;i>=0&&hist.length<8;i--){const s=m.starts[i],nx=m.starts[i+1];const g=m.groups.find(g=>g.start===s);hist.push({s,len:nx?diff(s,nx):null,cur:!nx,p:g?g.len:null})}
 const pat={menstrual:{},follicular:{},ovulatory:{},luteal:{}};let any=0;
 for(const s in S.days){const r=info(s,m);if(!r.phase||!pat[r.phase])continue;const e=S.days[s];[...(e.moods||[]),...(e.syms||[])].forEach(x=>{pat[r.phase][x]=(pat[r.phase][x]||0)+1;any++})}
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k} (${v})`).join(', ');
 $('#v-ins').innerHTML=`<h1 class="pageT">Insights</h1>
 <div class="stats"><div class="stat"><div class="v">${avgL??'–'}</div><div class="k">average cycle, in days</div></div>
 <div class="stat"><div class="v">${avgP??'–'}</div><div class="k">average period, in days</div></div>
 <div class="stat"><div class="v">${m.lens.length}</div><div class="k">${m.lens.length===1?'cycle':'cycles'} tracked</div></div></div>
 <div class="card"><h3>Your cycles</h3>${hist.length?`<div class="hist" style="margin-top:.8rem">${hist.map(h=>{const L=h.cur?(m.day||0):h.len;const w=Math.min(100,(L/45)*100),pw=h.p?Math.min(w,(h.p/45)*100):0;return`<div class="hrow"><span class="d">${fmt(h.s,{day:'numeric',month:'short'})}</span><span class="hbar"><u style="width:${w}%"></u><b style="width:${pw}%"></b></span><span class="l">${h.cur?'now':h.len}</span></div>`}).join('')}</div><p class="note">The coloured part is your period. The full bar is the whole cycle.</p>`:'<p>Your cycle history appears here once you log a period.</p>'}</div>
 <div class="card"><h3>Patterns by phase</h3>${any?['menstrual','follicular','ovulatory','luteal'].map(k=>`<div class="pat"><span class="pn">${PH[k].full}:</span> <span class="pv">${top(pat[k])||'nothing logged yet'}</span></div>`).join(''):'<p>Log your mood and symptoms for a few weeks to see what tends to show up in each phase.</p>'}</div>
 ${avgL&&(avgL<21||avgL>35)?`<p class="note">Your average cycle is outside the typical 21 to 35 days. That can be normal for you, but if it's new or comes with other changes, it's worth mentioning to a doctor.</p>`:''}`;
}

  if(b.dataset.m==='1'){const a=e[k]||[];e[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else e[k]=e[k]===v?'':v;
  tidy(logD);save();buzz();refreshSheet()});
 $('#lNote').oninput=ev=>{entry(logD).note=ev.target.value;tidy(logD);save()};
 $('#lDone').onclick=closeSheet;
}

/* customise */
const SW_BG=['','#F3EEF4','#FFFFFF','#F7EDEE','#E8F0EC','#E9E8F4','#EFEAE4','#17131A','#000000','#1B2230','#2A1D22'];
const SW_AC=['#C8475B','#E07A8B','#B0607A','#8E5BB5','#5A6ACF','#3D86A6','#5E9E95','#7FA35A','#D99A2B','#C9663A','#2A2230','#FFFFFF'];
const SW_TX=['','#FFFFFF','#F2EBF3','#E9E1D6','#B9AFBD','#7A6F80','#4A3F50','#2A2230','#000000','#C8475B','#5E9E95'];
let confirmErase=false;
function get(p){const[a,b]=p.split('.');return S[a][b]}
function set(p,v){const[a,b]=p.split('.');S[a][b]=v;save();applyLook()}
function swRow(label,key,list,hint){const val=get(key);const inList=list.includes(val);return`<div class="swl">${label}${hint?`<div class="hint" style="font-size:.8rem;color:var(--ink2);margin-top:.15rem">${hint}</div>`:''}</div><div class="sws">${list.map(c=>c?`<button class="sw${val===c?' on':''}" data-k="${key}" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`:`<button class="sw${val===''?' on':''}" data-k="${key}" data-v="" aria-label="Automatic">A</button>`).join('')}<label class="sw${!inList&&val?' on':''}" style="${!inList&&val?'background:'+val:''}" aria-label="Pick any colour">+<input type="color" data-k="${key}" value="${val||'#888888'}"></label></div>`}
function seg(key,opts){const v=get(key);return`<div class="seg">${opts.map(([k,l])=>`<button class="${v===k?'on':''}" data-k="${key}" data-v="${k}">${l}</button>`).join('')}</div>`}
function stepper(key,min,max){return`<div class="stepper"><button data-st="${key}" data-d="-1" data-min="${min}" data-max="${max}" aria-label="Less">−</button><span>${get(key)}</span><button data-st="${key}" data-d="1" data-min="${min}" data-max="${max}" aria-label="More">+</button></div>`}
function tog(key){return`<button class="tog${get(key)?' on':''}" data-tg="${key}" role="switch" aria-checked="${!!get(key)}"></button>`}
function rng(key,label,min,max,unit){return`<div class="rng"><div class="top"><span>${label}</span><span id="rv-${key.replace('.','-')}">${get(key)}${unit}</span></div><input type="range" min="${min}" max="${max}" value="${get(key)}" data-r="${key}" data-u="${unit}"></div>`}
function openCust(){loadAllFonts();confirmErase=false;openSheet(renderCust)}
function renderCust(){
 const L=S.look,st=S.setup,w=getWall(),m=model();
 const iconsOK=APP.platform==='android'&&window.Android&&Android.setAppIcon;
 let curIcon='';try{curIcon=iconsOK?Android.getAppIcon(ICONS.map(i=>i.id).join(',')):''}catch(e){}
 if(curIcon==='Default')curIcon=ICONS[0].id;
 $('#sheetBody').innerHTML=`<div class="sTop"><h2>Customise</h2></div>
 <div class="sec">Your cycle</div>
 <div class="set"><div><div class="lab">Last period started</div><div class="hint">Used until you log periods in the app</div></div><input type="date" class="dateIn" style="max-width:10.5rem;padding:.5rem .6rem" id="cStart" max="${today()}" value="${st.lastStart}"></div>
 <div class="set"><div><div class="lab">Days you usually bleed</div></div>${stepper('setup.bleed',1,10)}</div>
 <div class="set"><div><div class="lab">Cycle length</div><div class="hint">Most cycles are 21 to 35 days</div></div>${stepper('setup.cycle',18,50)}</div>
 <div class="set"><div><div class="lab">Learn from my logs</div><div class="hint">Once you've logged 3 periods, use your real averages instead. Right now: ${m.L}-day cycle, ${m.P}-day period</div></div>${tog('setup.learn')}</div>
 <div class="set"><div><div class="lab">Luteal phase</div><div class="hint">Days from ovulation to your period. 14 suits most people. Change it only if you know yours</div></div>${stepper('setup.luteal',9,17)}</div>
 <div class="set"><div class="lab">Week starts on</div>${seg('setup.weekStart',[[1,'Mon'],[0,'Sun']])}</div>

 <div class="sec">Background</div>
 <div class="set"><div class="lab">Mode</div>${seg('look.mode',[['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
 ${swRow('Background colour','look.bg',SW_BG,'A follows Mode')}
 <div class="wallRow">${w?`<div class="wallPrev" style="background-image:url('${w}')"></div>`:''}<button class="btn ghost" id="wPick">${w?'Change wallpaper':'Choose wallpaper'}</button>${w?'<button class="btn ghost" id="wDel">Remove</button>':''}</div>
 ${w?rng('look.dim','Dim wallpaper',0,90,'%')+rng('look.blur','Blur wallpaper',0,30,'px'):''}

 <div class="sec">Colours</div>
 ${swRow('Accent','look.accent',SW_AC.filter(Boolean),'Buttons and selected options')}
 ${swRow('Period','look.period',SW_AC.filter(Boolean))}
 ${swRow('Fertile days','look.fertile',SW_AC.filter(Boolean))}
 ${swRow('Ovulation','look.ovu',SW_AC.filter(Boolean))}
 ${swRow('Main text','look.text',SW_TX,'A picks automatically from your background')}
 ${swRow('Secondary text','look.text2',SW_TX)}

 <div class="sec">Text</div>
 <div class="fonts">${Object.keys(FONTS).map(f=>`<button class="${L.font===f?'on':''}" data-k="look.font" data-v="${f}" style="font-family:${f==='System'?'system-ui':'\''+f+'\''},system-ui">Aa ${f}<small>${f==='System'?'Your phone\'s font':'Needs internet the first time'}</small></button>`).join('')}</div>
 ${rng('look.size','Text size',80,130,'%')}

 <div class="sec">Cards</div>
 <div class="set"><div class="lab">Card style</div>${seg('look.card',[['glass','Glass'],['solid','Solid'],['outline','Line'],['none','None']])}</div>

 <div class="sec">Today screen</div>
 <div class="set"><div class="lab">Phase notes and symptoms</div>${tog('show.phase')}</div>
 <div class="set"><div class="lab">Mood check-in</div>${tog('show.mood')}</div>
 <div class="set"><div class="lab">Good to know facts</div>${tog('show.fact')}</div>

 <div class="sec">App icon</div>
 ${iconsOK?`<div class="icons">${ICONS.map(i=>`<button class="${curIcon===i.id?'on':''}" data-icon="${i.id}"><span class="ic" style="background:${i.bg}"><img src="${i.src}" alt=""></span>${esc(i.name)}</button>`).join('')}</div><p class="note" style="margin-top:0">Your home screen may refresh for a moment after switching. If the icon disappears, drag Cycle back from the app drawer.</p>`
 :`<div class="help"><p>On iPhone, the icon is fixed when you add Cycle to your home screen. To change it, replace icon.png in your GitHub repository. Then copy a backup below, remove Cycle from your home screen, add it again from Safari, and restore your backup.</p></div>`}

 <div class="sec">Backup</div>
 <div class="help"><p>Your data lives only on this phone. Copy a backup now and then and keep it somewhere safe, like your notes.</p></div>
 <div class="actions" style="margin:.6rem 0 0"><button class="btn ghost" id="bCopy">Copy backup</button><button class="btn ghost" id="bShow">Restore</button></div>
 <div id="restore" style="display:none;margin-top:.8rem"><textarea class="txt" id="bTxt" placeholder="Paste your backup here"></textarea><button class="btn wide" id="bGo" style="margin-top:.6rem">Restore backup</button></div>
 <div style="margin-top:1rem"><button class="btn ${confirmErase?'warn':'ghost'}" id="bErase">${confirmErase?'Tap again to erase everything':'Erase all data'}</button></div>

 <div class="sec">Help</div>
 <div class="help"><p>Cycle for ${APP.platform==='android'?'Android':'iPhone'}, version ${APP.version}.</p>
 <p>Predictions use your cycle length and a ${st.luteal}-day luteal phase. Ovulation is placed ${st.luteal} days before your next expected period, and the fertile window is the 5 days before it plus the day after.</p>
 <p>Cycle is a tracker, not medical advice or contraception. If something feels off, talk to a doctor or nurse.</p></div>
 <button class="btn wide done" id="cDone">Done</button>`;
 bindCust();
}
function bindCust(){
 const B=$('#sheetBody');
 B.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(b.dataset.k==='setup.weekStart')v=+v;set(b.dataset.k,v);buzz();refreshSheet()});
 B.querySelectorAll('input[type=color][data-k]').forEach(i=>{i.oninput=()=>{set(i.dataset.k,i.value)};i.onchange=()=>refreshSheet()});
 B.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const k=b.dataset.st;set(k,Math.max(+b.dataset.min,Math.min(+b.dataset.max,get(k)+ +b.dataset.d)));buzz();refreshSheet()});
 B.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{set(b.dataset.tg,!get(b.dataset.tg));buzz();refreshSheet()});
 B.querySelectorAll('[data-r]').forEach(i=>{i.oninput=()=>{const[a,k]=i.dataset.r.split('.');S[a][k]=+i.value;$('#rv-'+a+'-'+k).textContent=i.value+i.dataset.u;applyLook()};i.onchange=()=>save()});
 $('#cStart').onchange=e=>{set('setup.lastStart',e.target.value);refreshSheet()};
 $('#wPick').onclick=()=>$('#wallFile').click();
 $('#wDel')&&($('#wDel').onclick=()=>{try{localStorage.removeItem(WKEY)}catch(e){}applyLook();refreshSheet()});
 B.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{try{const r=Android.setAppIcon(b.dataset.icon,ICONS.map(i=>i.id).join(','));if(r==='ok'){toast('App icon changed');refreshSheet()}else toast('Could not change the icon')}catch(e){toast('Could not change the icon')}});
 $('#bCopy').onclick=()=>copy(JSON.stringify({app:'cycle',v:1,data:S}));
 $('#bShow').onclick=()=>{$('#restore').style.display='block';$('#bTxt').focus()};
 $('#bGo').onclick=()=>{try{const o=JSON.parse($('#bTxt').value.trim());const d=o&&o.data?o.data:o;if(!d||typeof d.days!=='object')throw 0;S=merge(clone(DEF),d);save();applyLook();toast('Backup restored');closeSheet()}catch(e){toast('That doesn\'t look like a Cycle backup. Paste the whole text you copied.')}};
 $('#bErase').onclick=()=>{if(!confirmErase){confirmErase=true;refreshSheet();return}try{localStorage.removeItem(KEY);localStorage.removeItem(WKEY)}catch(e){}S=clone(DEF);confirmErase=false;applyLook();closeSheet();toast('All data erased')};
 $('#cDone').onclick=closeSheet;
}
function copy(t){
 try{if(window.Android&&Android.copy){Android.copy(t);toast('Backup copied');return}}catch(e){}
 const done=()=>toast('Backup copied');
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback())}else fallback();
 function fallback(){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Copy failed')}a.remove()}
}
$('#wallFile').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const mx=1600,sc=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.85,u=c.toDataURL('image/jpeg',q);while(u.length>2.4e6&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}try{localStorage.setItem(WKEY,u);applyLook();toast('Wallpaper set');refreshSheet()}catch(er){toast('That image is too large. Try a smaller one')}};img.onerror=()=>toast('That file could not be opened as an image');img.src=rd.result};rd.readAsDataURL(f)};

/* ---------- start ---------- */
$$('#nav [data-v]').forEach(b=>b.onclick=()=>{buzz();go(b.dataset.v)});
$('#navCust').onclick=()=>{buzz();openCust()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheetRender)render()});
applyLook();go('today');
if(APP.platform==='iphone'&&'serviceWorker'in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
